name: Analytics Smoke

on:
  push:
    branches: [main]
    paths:
      - '.analytics-smoke/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      RUNTIME_AUTH_A: ${{ secrets.RUNTIME_AUTH_A }}
      RUNTIME_AUTH_B: ${{ secrets.RUNTIME_AUTH_B }}
      RUNTIME_AUTH_C: ${{ secrets.RUNTIME_AUTH_C }}
    steps:
      - name: Checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Checkout private state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_STATE_TOKEN }}
          ref: main
          fetch-depth: 1
          path: private-state
      - run: echo analytics-smoke-ok
