name: Legacy Creative Refresh

on:
  push:
    paths:
      - '.github/workflows/legacy-creative-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: exec
    env:
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      RUNTIME_AUTH_A: ${{ secrets.RUNTIME_AUTH_A }}
      RUNTIME_AUTH_B: ${{ secrets.RUNTIME_AUTH_B }}
      RUNTIME_AUTH_C: ${{ secrets.RUNTIME_AUTH_C }}
    steps:
      - name: Patch legacy creative loader
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          path = 'runtime/analytics.py'
          url = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
              doc = json.load(r)
          text = base64.b64decode(doc['content']).decode('utf-8')
          old = '        items = doc.get("items") if isinstance(doc, dict) else None\n        if not isinstance(items, list):\n            continue\n'
          new = '        if isinstance(doc, dict) and isinstance(doc.get("items"), list):\n            items = doc["items"]\n        elif isinstance(doc, dict) and CID_RE.fullmatch(str(doc.get("content_id", ""))):\n            items = [doc]\n        else:\n            continue\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('legacy creative loader marker not found')
          compile(text, path, 'exec')
          body = json.dumps({'message': 'fix: support legacy single-item creative requests', 'content': base64.b64encode(text.encode()).decode(), 'sha': doc['sha']}).encode()
          req = urllib.request.Request(url, data=body, method='PUT', headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              out = json.load(r)
          print(out['commit']['sha'])
          PY

      - name: Load latest runtime source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/main"
          urllib.request.urlretrieve(url,"/tmp/runtime-source.tgz")
          PY
          rm -rf /tmp/runtime-source
          mkdir -p /tmp/runtime-source
          tar --extract --gzip --file /tmp/runtime-source.tgz --strip-components 1 --directory /tmp/runtime-source

      - name: Refresh analytics context
        run: python /tmp/runtime-source/runtime/analytics_remote.py
