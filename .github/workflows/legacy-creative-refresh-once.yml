name: Legacy Creative Analytics Refresh (One-Off)

on:
  push:
    paths:
      - '.github/workflows/legacy-creative-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: exec
    env:
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      RUNTIME_AUTH_A: ${{ secrets.RUNTIME_AUTH_A }}
      RUNTIME_AUTH_B: ${{ secrets.RUNTIME_AUTH_B }}
      RUNTIME_AUTH_C: ${{ secrets.RUNTIME_AUTH_C }}
    steps:
      - name: Patch legacy creative request support and refresh analytics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, shutil, subprocess, sys, tarfile, tempfile, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          path = 'runtime/analytics.py'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          url = f'https://api.github.com/repos/{repo}/contents/{path}'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
              doc = json.load(response)
          content = base64.b64decode(doc['content']).decode('utf-8')

          old = '''        items = doc.get("items") if isinstance(doc, dict) else None
          if not isinstance(items, list):
              continue
'''
          new = '''        if isinstance(doc, dict) and isinstance(doc.get("items"), list):
              items = doc["items"]
          elif isinstance(doc, dict) and CID_RE.fullmatch(str(doc.get("content_id", ""))):
              items = [doc]
          else:
              continue
'''
          if old in content:
              content = content.replace(old, new, 1)
          elif new not in content:
              raise SystemExit('legacy creative loader marker not found')

          compile(content, path, 'exec')
          body = json.dumps({
              'message': 'fix: support legacy single-item creative requests',
              'content': base64.b64encode(content.encode('utf-8')).decode('ascii'),
              'sha': doc['sha'],
          }).encode()
          req = urllib.request.Request(url, data=body, method='PUT', headers=headers)
          with urllib.request.urlopen(req, timeout=60) as response:
              patched = json.load(response)
          commit_sha = patched['commit']['sha']
          print('RUNTIME_COMMIT', commit_sha)

          work = pathlib.Path(tempfile.mkdtemp(prefix='legacy-creative-refresh-'))
          try:
              archive = work / 'runtime.tgz'
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/tarball/{commit_sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=120) as response, archive.open('wb') as out:
                  shutil.copyfileobj(response, out)
              extract = work / 'extract'
              extract.mkdir()
              with tarfile.open(archive, 'r:gz') as tf:
                  tf.extractall(extract)
              roots = [p for p in extract.iterdir() if p.is_dir()]
              if len(roots) != 1:
                  raise SystemExit('unexpected runtime tarball layout')
              subprocess.run(
                  [sys.executable, str(roots[0] / 'runtime' / 'analytics_remote.py')],
                  cwd=roots[0],
                  check=True,
                  env=os.environ.copy(),
              )
          finally:
              shutil.rmtree(work, ignore_errors=True)
          PY
