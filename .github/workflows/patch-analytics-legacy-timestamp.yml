name: Patch Analytics Legacy Timestamp (One-Off)

on:
  push:
    paths:
      - '.github/workflows/patch-analytics-legacy-timestamp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch analytics timestamp compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          path = 'runtime/analytics.py'
          url = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              doc = json.load(response)

          content = base64.b64decode(doc['content']).decode('utf-8')
          old = 'published = parse_dt(str(result.get("publish_at", "")))'
          new = 'published = parse_dt(str(result.get("publish_at") or result.get("published_at") or ""))'
          if old not in content:
              if new in content:
                  print('Patch already present')
                  raise SystemExit(0)
              raise SystemExit('Expected analytics timestamp line not found')

          patched = content.replace(old, new, 1)
          body = json.dumps({
              'message': 'fix: support legacy published_at analytics results',
              'content': base64.b64encode(patched.encode('utf-8')).decode('ascii'),
              'sha': doc['sha'],
          }).encode()
          req = urllib.request.Request(url, data=body, method='PUT', headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              out = json.load(response)
          print('Patched commit=', out['commit']['sha'])
          PY
