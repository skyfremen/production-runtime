name: Verify V2

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/single.yml'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Compile and self-test without production access
        run: |
          python -m compileall -q runtime
          PYTHONPATH=runtime python runtime/self_test.py
          PYTHONPATH=runtime python runtime/background_contract_test.py
          PYTHONPATH=runtime python runtime/preflight_contract_test.py
