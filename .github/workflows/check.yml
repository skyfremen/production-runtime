name: Check

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/skyfremen/runtime-base@sha256:b570d4026ddd4a4ab66c98840a7f9cb078c37fdbd9464353f9f689d9a5dd232f
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Prepare
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Verify
        shell: bash
        run: |
          if python -m unittest discover -s tests > /tmp/runtime-tests.log 2>&1; then
            echo "Check PASS"
          else
            echo "::error::Check FAIL"
            exit 1
          fi

      - name: Exercise
        shell: bash
        run: |
          if python runtime/exercise.py > /tmp/runtime-exercise.log 2>&1; then
            echo "Exercise PASS"
          else
            stage="$(cat /tmp/runtime-acceptance-phase 2>/dev/null || true)"
            case "${stage}" in
              batch|render|render_asset|render_encode|render_layout|render_metadata|render_AssertionError|render_FileNotFoundError|render_KeyError|render_RuntimeError|render_SystemExit|render_other|tts|alignment)
                ;;
              *) stage="unknown" ;;
            esac
            echo "::error::E_VERIFY_001 stage=${stage}"
            exit 1
          fi
