name: Check

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/skyfremen/runtime-base@sha256:e70690e29f9323bd59e6d305b3c15594a5d877ef785db159c8048eb297737050
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Prepare
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Verify
        shell: bash
        run: |
          if python -m unittest discover -s tests > /tmp/runtime-tests.log 2>&1; then
            echo "Check PASS"
          else
            echo "::error::Check FAIL"
            exit 1
          fi

      - name: Exercise
        shell: bash
        run: |
          if python runtime/exercise.py > /tmp/runtime-exercise.log 2>&1; then
            echo "Exercise PASS"
          else
            echo "::error::Exercise FAIL"
            exit 1
          fi
