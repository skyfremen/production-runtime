name: Runtime Check
run-name: Verify execution boundary

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: exec
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner@sha256:a4ecdb1be1dd1dd4e2dec36d2f507471091290eee5963b0ae4e3d65469bf5e76
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Load runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run static and unit checks
        shell: bash
        run: |
          if python -m unittest discover -s tests > /tmp/runtime-tests.log 2>&1; then
            echo "Runtime test suite PASS"
          else
            echo "::error::Runtime test suite FAIL"
            exit 1
          fi
      - name: Run production-equivalent acceptance
        shell: bash
        run: |
          if python runtime/acceptance.py > /tmp/runtime-acceptance.log 2>&1; then
            echo "Production-equivalent acceptance PASS: items=24"
            python - <<'PY'
          import json
          summary = json.load(open("/tmp/runtime-acceptance-summary.json", encoding="utf-8"))
          keys = (
              "render_seconds", "resolution", "fps", "video_codec", "audio_codec",
              "audio_stream_count", "tts_backend", "tts_voice", "tts_speed",
              "tts_init_seconds", "alignment_backend", "alignment_coverage",
              "validation_count", "upload_count",
          )
          print("Acceptance metrics: " + " ".join(f"{key}={summary[key]}" for key in keys))
          PY
          else
            phase="$(cat /tmp/runtime-acceptance-phase 2>/dev/null || echo startup)"
            echo "::error::Production-equivalent acceptance FAIL at ${phase}"
            exit 1
          fi
