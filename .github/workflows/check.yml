name: Check

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/skyfremen/runtime-base@sha256:088a5db8789e199e56d60d484e97c769ba038a992731042014fefa15d3132d7a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Prepare
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Verify
        shell: bash
        run: |
          if python -m unittest discover -s tests > /tmp/runtime-tests.log 2>&1; then
            echo "Check PASS"
          else
            echo "::error::Check FAIL"
            exit 1
          fi

      - name: Exercise
        shell: bash
        run: |
          if python runtime/exercise.py > /tmp/runtime-exercise.log 2>&1; then
            echo "Exercise PASS"
          else
            stage="$(cat /tmp/runtime-check-stage 2>/dev/null || true)"
            case "${stage}" in
              s01|s02|s02a|s02b|s02c|s02d|s02e|s02f|s02g|s02h|s02i|s02j|s02k|s02l|s02x|s03|s04)
                ;;
              *) stage="unknown" ;;
            esac
            echo "::error::E_VERIFY_001 stage=${stage}"
            exit 1
          fi
