name: Check

on:
  push:
    branches: [automatic-recovery-20260911]
  schedule:
    # 01:30 / 07:30 / 13:30 / 19:30 Asia/Singapore (UTC+8)
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation
        required: false
        default: check
        type: choice
        options:
          - check
          - observe

permissions:
  contents: read
  packages: read

jobs:
  check:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'observe')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/skyfremen/runtime-base@sha256:6ab68475deb3f0c3e531ff2913da283ceb7e682572acdbd1bff14709b07ffdca
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Prepare
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Verify
        shell: bash
        run: |
          if python -m unittest discover -s tests > /tmp/runtime-tests.log 2>&1; then
            echo "Check PASS"
          else
            cat /tmp/runtime-tests.log
            echo "::error::Check FAIL"
            exit 1
          fi

      - name: Exercise
        shell: bash
        run: |
          if python runtime/exercise.py > /tmp/runtime-exercise.log 2>&1; then
            echo "Exercise PASS"
          else
            stage="$(cat /tmp/runtime-check-stage 2>/dev/null || true)"
            if [[ "${stage}" == "s02n" ]]; then
              if grep -q "H.264 profile" /tmp/runtime-exercise.log; then stage="s02n1"
              elif grep -q "pixel format" /tmp/runtime-exercise.log; then stage="s02n2"
              elif grep -q "color_space" /tmp/runtime-exercise.log; then stage="s02n3"
              elif grep -q "color_transfer" /tmp/runtime-exercise.log; then stage="s02n4"
              elif grep -q "color_primaries" /tmp/runtime-exercise.log; then stage="s02n5"
              elif grep -q "AAC profile" /tmp/runtime-exercise.log; then stage="s02n6"
              elif grep -q "audio sample rate" /tmp/runtime-exercise.log; then stage="s02n7"
              else stage="s02n9"
              fi
            fi
            case "${stage}" in
              s01|s02|s02a|s02b|s02c|s02d|s02e|s02f|s02g|s02h|s02i|s02j|s02k|s02l|s02m|s02n1|s02n2|s02n3|s02n4|s02n5|s02n6|s02n7|s02n9|s02x|s03|s04)
                ;;
              *) stage="unknown" ;;
            esac
            echo "::error::E_VERIFY_001 stage=${stage}"
            exit 1
          fi

  observe:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'observe')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: exec
    container:
      image: ghcr.io/skyfremen/runtime-base@sha256:6ab68475deb3f0c3e531ff2913da283ceb7e682572acdbd1bff14709b07ffdca
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      RUNTIME_AUTH_A: ${{ secrets.YOUTUBE_CLIENT_ID }}
      RUNTIME_AUTH_B: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      RUNTIME_AUTH_C: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Prepare
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Observe
        run: python runtime/observe.py --output /tmp/runtime-observation.json

      - name: Store
        run: python runtime/state_sink.py --input /tmp/runtime-observation.json
