name: Review Evidence
run-name: Review evidence ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Immutable private discovery request ID
        required: true
        type: string
      source_sha:
        description: Exact private-state commit containing the discovery result
        required: true
        type: string
      discovery_result:
        description: Exact private discovery-result repository path
        required: true
        type: string

concurrency:
  group: review-evidence-${{ inputs.request_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: exec
    env:
      PYTHONPATH: runtime
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install FFmpeg for evidence extraction
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Materialize exact-source review evidence
        shell: bash
        env:
          REVIEW_REQUEST_ID: ${{ inputs.request_id }}
          REVIEW_SOURCE_SHA: ${{ inputs.source_sha }}
          REVIEW_DISCOVERY_RESULT: ${{ inputs.discovery_result }}
        run: |
          set -euo pipefail
          rm -rf /tmp/background-review-evidence
          python runtime/review_evidence.py \
            --request-id "${REVIEW_REQUEST_ID}" \
            --source-sha "${REVIEW_SOURCE_SHA}" \
            --discovery-result "${REVIEW_DISCOVERY_RESULT}" \
            --output-dir /tmp/background-review-evidence

      - name: Upload review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: background-review-evidence-${{ inputs.request_id }}
          path: /tmp/background-review-evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
