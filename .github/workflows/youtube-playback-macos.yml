name: YouTube Playback Mac Runner Experiment

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Public YouTube watch or Shorts URL"
        required: true
        type: string
        default: "https://www.youtube.com/watch?v=aqz-KE-bpKQ"

permissions:
  contents: read

jobs:
  macos-playback:
    runs-on: macos-latest
    timeout-minutes: 8
    env:
      YOUTUBE_URL: ${{ inputs.youtube_url || 'https://www.youtube.com/watch?v=aqz-KE-bpKQ' }}
    steps:
      - name: Load isolated experiment source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request
          urllib.request.urlretrieve(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}",
            "/tmp/source.tgz")
          PY
          tar -xzf /tmp/source.tgz --strip-components 1 -C "${GITHUB_WORKSPACE}"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Verify YouTube iframe playback
        run: node experiments/youtube-playback/check-iframe.mjs

      - name: Print report
        if: always()
        run: |
          if [ -f experiments/youtube-playback/artifacts/iframe-report.json ]; then
            cat experiments/youtube-playback/artifacts/iframe-report.json
          fi
