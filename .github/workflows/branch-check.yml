name: Branch Check

on:
  push:
    branches: [automatic-recovery-20260911]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/skyfremen/runtime-base@sha256:6ab68475deb3f0c3e531ff2913da283ceb7e682572acdbd1bff14709b07ffdca
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
    steps:
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/source.tgz")
          PY
          tar --extract --gzip --file /tmp/source.tgz --strip-components 1 --directory "${GITHUB_WORKSPACE}"
      - name: Compile
        run: find runtime tests -type f -name '*.py' -print0 | xargs -0 python -m py_compile
      - name: Test
        run: python -m unittest discover -s tests -v
