name: Run

on:
  workflow_dispatch:
    inputs:
      batch_id: {description: Opaque identifier, required: true, type: string}
      source_sha: {description: Exact source revision, required: true, type: string}
      contract_hash: {description: Compatibility fingerprint, required: true, type: string}
      dispatch_id: {description: Correlation identifier, required: true, type: string}

concurrency:
  group: run-${{ inputs.batch_id }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: exec
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      concurrency: ${{ steps.plan.outputs.concurrency }}
      registry_sha: ${{ steps.shared.outputs.registry_sha }}
      registry_refresh: ${{ steps.shared.outputs.registry_refresh }}
    container: &runtime_container
      image: ghcr.io/skyfremen/runtime-base@sha256:6ab68475deb3f0c3e531ff2913da283ceb7e682572acdbd1bff14709b07ffdca
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      RUNTIME_SOURCE_KEY: ${{ secrets.PEXELS_API_KEY }}
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - &start_step
        name: Start
        shell: bash
        env:
          START_BATCH_ID: ${{ inputs.batch_id }}
          START_SOURCE_SHA: ${{ inputs.source_sha }}
          START_CONTRACT_HASH: ${{ inputs.contract_hash }}
          START_DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          batch_id = os.environ['START_BATCH_ID']
          source_sha = os.environ['START_SOURCE_SHA']
          contract_hash = os.environ['START_CONTRACT_HASH']
          dispatch_id = os.environ['START_DISPATCH_ID']
          repository = os.environ['PRIVATE_STATE_REPOSITORY']
          token = os.environ['PRIVATE_STATE_TOKEN']
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          run_attempt = os.environ.get('GITHUB_RUN_ATTEMPT', '')
          runtime_sha = os.environ.get('RUNTIME_COMMIT_SHA', '')

          if not re.fullmatch(r'[br]_[0-9a-f]{30}', batch_id):
              raise SystemExit('E_START_001')
          if not re.fullmatch(r'[0-9a-f]{40}', source_sha):
              raise SystemExit('E_START_001')
          if not re.fullmatch(r'[0-9a-f]{64}', contract_hash):
              raise SystemExit('E_START_001')
          if not re.fullmatch(r'd_[0-9a-f]{24}', dispatch_id):
              raise SystemExit('E_START_001')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise SystemExit('E_START_001')
          if not run_id.isdigit() or not run_attempt.isdigit() or not re.fullmatch(r'[0-9a-f]{40}', runtime_sha):
              raise SystemExit('E_START_001')

          def api(endpoint, method='GET', body=None):
              url = f'https://api.github.com/repos/{repository}/{endpoint}'
              data = None if body is None else json.dumps(body).encode()
              request = Request(url, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urlopen(request, timeout=45) as response:
                  return json.load(response)

          def read(path):
              result = api(f'contents/{quote(path, safe="/")}?ref=main')
              raw = base64.b64decode(''.join(str(result['content']).split()), validate=True)
              blob = hashlib.sha1(f'blob {len(raw)}\\0'.encode() + raw).hexdigest()
              if result.get('type') != 'file' or result.get('encoding') != 'base64' or result.get('sha') != blob:
                  raise ValueError('invalid private state')
              return raw

          intent_path = f'youtube-shorts-bot/content/recovery/dispatch-intents/{batch_id}/{dispatch_id}.json'
          try:
              intent = json.loads(read(intent_path))
          except (HTTPError, URLError, TimeoutError, ValueError, KeyError, json.JSONDecodeError):
              raise SystemExit('E_START_001') from None

          expected = {
              'schema_version': 1,
              'state': 'prepared',
              'batch_id': batch_id,
              'dispatch_id': dispatch_id,
              'source_sha': source_sha,
              'contract_hash': contract_hash,
          }
          if any(intent.get(key) != value for key, value in expected.items()):
              raise SystemExit('E_START_001')

          payload = {
              'schema_version': 1,
              'state': 'started',
              'batch_id': batch_id,
              'dispatch_id': dispatch_id,
              'source_sha': source_sha,
              'contract_hash': contract_hash,
              'runtime_commit_sha': runtime_sha,
              'workflow_run_id': run_id,
              'workflow_run_attempt': run_attempt,
              'started_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          raw = (json.dumps(payload, indent=2, sort_keys=True) + '\n').encode()
          path = f'youtube-shorts-bot/content/recovery/starts/{batch_id}/{dispatch_id}/{run_id}-{run_attempt}.json'
          encoded = quote(path, safe='/')

          for attempt in range(4):
              try:
                  existing = read(path)
              except HTTPError as exc:
                  if exc.code != 404:
                      raise SystemExit('E_START_001') from None
                  existing = None
              except (URLError, TimeoutError, ValueError, KeyError):
                  existing = None
              if existing is not None:
                  if existing != raw:
                      raise SystemExit('E_START_001')
                  print('Start PASS')
                  raise SystemExit(0)
              try:
                  api(f'contents/{encoded}', 'PUT', {
                      'branch': 'main',
                      'message': 'record opaque runtime start',
                      'content': base64.b64encode(raw).decode(),
                  })
                  print('Start PASS')
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except (HTTPError, URLError, TimeoutError):
                  try:
                      existing = read(path)
                  except Exception:
                      existing = None
                  if existing == raw:
                      print('Start PASS')
                      raise SystemExit(0)
                  if attempt < 3:
                      time.sleep(0.25 * (2 ** attempt))

          raise SystemExit('E_START_001')
          PY
      - &source_step
        name: Source
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"
      - &compat_step
        name: Compatibility
        env: {CONTRACT_HASH: "${{ inputs.contract_hash }}"}
        run: >-
          python -c 'import os; from base.compat import validate_contract_hash;
          validate_contract_hash(os.environ.get("CONTRACT_HASH"))'
      - name: Load
        run: >-
          python runtime/transport.py fetch --batch-id "${{ inputs.batch_id }}"
          --source-sha "${{ inputs.source_sha }}" --output /tmp/runtime-batch.json
      - name: Shared preparation
        id: shared
        run: python runtime/core.py --manifest /tmp/runtime-batch.json --prepare-shared
      - name: Plan
        id: plan
        run: >-
          python runtime/engine/shard.py --manifest /tmp/runtime-batch.json
          --profile paired

  units:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: exec
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    container: *runtime_container
    env:
      PYTHONPATH: runtime
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      RUNTIME_AUTH_A: ${{ secrets.YOUTUBE_CLIENT_ID }}
      RUNTIME_AUTH_B: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      RUNTIME_AUTH_C: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - *source_step
      - *compat_step
      - name: Load
        run: |
          python runtime/transport.py fetch --batch-id "${{ inputs.batch_id }}" \
            --source-sha "${{ inputs.source_sha }}" --output /tmp/runtime-batch.json
          if [ "${{ needs.prepare.outputs.registry_refresh }}" = "1" ]; then
            python runtime/transport.py refresh-registry --manifest /tmp/runtime-batch.json \
              --expected-blob-sha "${{ needs.prepare.outputs.registry_sha }}"
          fi
      - name: Execute
        id: execute
        continue-on-error: true
        run: >-
          python runtime/core.py --manifest /tmp/runtime-batch.json
          --profile paired --shard-index "${{ matrix.index }}"
          --concurrency "${{ needs.prepare.outputs.concurrency }}" --no-persist-registry
      - name: Export
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-${{ matrix.index }}
          path: /tmp/runtime-public-summary.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Verify
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "${{ steps.execute.outcome }}" != "success" ]; then
            echo "::error::E_EXEC_001"
            exit 1
          fi

  aggregate:
    needs: [prepare, units]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: exec
    container: *runtime_container
    env:
      PYTHONPATH: runtime
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - *source_step
      - *compat_step
      - name: Load
        run: >-
          python runtime/transport.py fetch --batch-id "${{ inputs.batch_id }}"
          --source-sha "${{ inputs.source_sha }}" --output /tmp/runtime-batch.json
      - name: Import
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: unit-*
          path: /tmp/unit-results
      - name: Aggregate
        id: result
        continue-on-error: true
        run: >-
          python runtime/engine/aggregate.py --manifest /tmp/runtime-batch.json
          --results /tmp/unit-results --profile paired
      - name: Finalize
        id: completion
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ steps.result.outcome }}" != "success" ] || [ ! -f /tmp/runtime-public-summary.json ]; then
            exit 1
          fi
          failed="$(python -c 'import json; print(int(json.load(open("/tmp/runtime-public-summary.json"))["failed"]))')"
          if [ "${failed}" = "0" ]; then
            python runtime/transport.py complete --manifest /tmp/runtime-batch.json \
              --summary /tmp/runtime-public-summary.json
          elif [ -f /tmp/runtime-diagnostic.json ]; then
            python runtime/transport.py diagnose --manifest /tmp/runtime-batch.json \
              --diagnostic /tmp/runtime-diagnostic.json
          else
            exit 1
          fi
      - name: Verify
        if: ${{ always() }}
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.result.outcome }}" != "success" ]; then
            echo "::error::E_EXEC_001"
            failed=1
          elif [ "$(python -c 'import json; print(int(json.load(open("/tmp/runtime-public-summary.json"))["failed"]))')" != "0" ]; then
            echo "::error::E_EXEC_001"
            failed=1
          fi
          if [ "${{ steps.completion.outcome }}" != "success" ]; then
            echo "::error::E_STATE_001"
            failed=1
          fi
          exit "${failed}"
