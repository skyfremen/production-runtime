name: Run

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Opaque identifier
        required: true
        type: string
      source_sha:
        description: Exact source revision
        required: true
        type: string

concurrency:
  group: run-${{ inputs.batch_id }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: exec
    container:
      image: ghcr.io/skyfremen/runtime-base@sha256:088a5db8789e199e56d60d484e97c769ba038a992731042014fefa15d3132d7a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      RUNTIME_AUTH_A: ${{ secrets.YOUTUBE_CLIENT_ID }}
      RUNTIME_AUTH_B: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      RUNTIME_AUTH_C: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      RUNTIME_SOURCE_KEY: ${{ secrets.PEXELS_API_KEY }}
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Prepare
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Load
        run: >-
          python runtime/transport.py fetch
          --batch-id "${{ inputs.batch_id }}"
          --source-sha "${{ inputs.source_sha }}"
          --output /tmp/runtime-batch.json

      - name: Execute
        id: execute
        continue-on-error: true
        run: python runtime/core.py --manifest /tmp/runtime-batch.json --concurrency 2

      - name: Finalize
        id: completion
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ steps.execute.outcome }}" = "success" ] && [ -f /tmp/runtime-public-summary.json ]; then
            python runtime/transport.py complete \
              --manifest /tmp/runtime-batch.json \
              --summary /tmp/runtime-public-summary.json
          elif [ -f /tmp/runtime-batch.json ] && [ -f /tmp/runtime-diagnostic.json ]; then
            python runtime/transport.py diagnose \
              --manifest /tmp/runtime-batch.json \
              --diagnostic /tmp/runtime-diagnostic.json
          else
            echo "::error::E_STATE_001"
            exit 1
          fi

      - name: Verify
        if: ${{ always() }}
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.execute.outcome }}" != "success" ]; then
            code="E_EXEC_001"
            if [ -f /tmp/runtime-diagnostic.json ]; then
              candidate="$(python -c 'import json; print(json.load(open("/tmp/runtime-diagnostic.json"))["error_code"])')"
              case "${candidate}" in
                E_EXEC_001|E_VERIFY_001) code="${candidate}" ;;
              esac
            fi
            echo "::error::${code}"
            failed=1
          fi
          if [ "${{ steps.completion.outcome }}" != "success" ]; then
            echo "::error::E_STATE_001"
            failed=1
          fi
          exit "${failed}"
