name: Run

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Opaque identifier
        required: true
        type: string
      source_sha:
        description: Exact source revision
        required: true
        type: string

concurrency:
  group: run-${{ inputs.batch_id }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: exec
    container:
      image: ghcr.io/skyfremen/runtime-base@sha256:e70690e29f9323bd59e6d305b3c15594a5d877ef785db159c8048eb297737050
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
      VIDEO_WIDTH: '720'
      VIDEO_HEIGHT: '1280'
      VIDEO_FPS: '30'
      STORY_TEST_MODE: 'false'
      SHORTS_CONCURRENCY: '2'
    steps:
      - name: Prepare
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Load
        run: >-
          python runtime/state_transport.py fetch
          --batch-id "${{ inputs.batch_id }}"
          --source-sha "${{ inputs.source_sha }}"
          --output /tmp/runtime-batch.json

      - name: Execute
        id: execute
        continue-on-error: true
        run: python runtime/runner.py --manifest /tmp/runtime-batch.json --concurrency 2

      - name: Finalize
        id: completion
        if: ${{ always() && steps.execute.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -f /tmp/runtime-public-summary.json ]; then
            python runtime/state_transport.py complete \
              --manifest /tmp/runtime-batch.json \
              --summary /tmp/runtime-public-summary.json
          fi

      - name: Verify
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "${{ steps.execute.outcome }}" != "success" ]; then
            echo "::error::Execution failed."
            exit 1
          fi
          if [ "${{ steps.completion.outcome }}" != "success" ]; then
            echo "::error::Finalization failed."
            exit 1
          fi
