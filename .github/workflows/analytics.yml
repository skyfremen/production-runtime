name: Analytics

on:
  schedule:
    # 01:30, 07:30, 13:30, 19:30 Asia/Singapore (UTC+8)
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: exec
    env:
      RUNTIME_AUTH_A: ${{ secrets.RUNTIME_AUTH_A }}
      RUNTIME_AUTH_B: ${{ secrets.RUNTIME_AUTH_B }}
      RUNTIME_AUTH_C: ${{ secrets.RUNTIME_AUTH_C }}
    steps:
      - name: Checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Checkout private state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_STATE_TOKEN }}
          ref: main
          fetch-depth: 1
          path: private-state

      - name: Collect, reduce, and persist analytics
        shell: bash
        run: |
          set -euo pipefail
          state="${GITHUB_WORKSPACE}/private-state"

          for attempt in 1 2 3; do
            cd "${state}"
            git fetch origin main
            git reset --hard origin/main
            cd "${GITHUB_WORKSPACE}"

            python runtime/analytics.py --state-dir "${state}"

            cd "${state}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/analytics content/analytics-summary.json content/context.json

            mapfile -t changed < <(git diff --cached --name-only)
            for path in "${changed[@]}"; do
              if [[ ! "${path}" =~ ^content/analytics/snapshots/analytics-[0-9TZ]+\.json$ ]] && \
                 [[ "${path}" != "content/analytics-summary.json" ]] && \
                 [[ "${path}" != "content/context.json" ]]; then
                echo "::error::ANALYTICS_WRITE_SCOPE_VIOLATION ${path}"
                exit 1
              fi
            done

            if git diff --cached --quiet; then
              echo "Analytics state already current."
              exit 0
            fi

            git commit -m "[analytics] refresh YouTube performance context"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "::warning::Private main advanced; recomputing from latest main (${attempt}/3)"
          done

          echo "::error::ANALYTICS_PUSH_RETRY_EXHAUSTED"
          exit 1
