name: YouTube Playback Smoke Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-playback-check.yml"
      - "experiments/youtube-playback/**"
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Public YouTube video or Shorts URL to check"
        required: true
        type: string
        default: "https://www.youtube.com/watch?v=jNQXAC9IVRw"

permissions:
  contents: read

jobs:
  playback-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_URL: ${{ inputs.youtube_url }}

    steps:
      - name: Load exact source (no third-party actions)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/playback-source.tgz")
          PY
          tar --extract --gzip --file /tmp/playback-source.tgz \
            --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Install Playwright and Chromium
        run: |
          node --version
          npm --version
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Check YouTube playback
        run: node experiments/youtube-playback/check-playback.mjs

      - name: Print diagnostics
        if: always()
        run: |
          if [ -f experiments/youtube-playback/artifacts/report.json ]; then
            cat experiments/youtube-playback/artifacts/report.json
          fi
