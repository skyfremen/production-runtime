name: YouTube Playback Smoke Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-playback-check.yml"
      - "experiments/youtube-playback/**"
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Public YouTube video or Shorts URL"
        required: true
        type: string
        default: "https://www.youtube.com/watch?v=jNQXAC9IVRw"

permissions:
  contents: read

jobs:
  playback-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_URL: ${{ inputs.youtube_url }}
    steps:
      - name: Load exact source without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url, "/tmp/source.tgz")
          PY
          tar -xzf /tmp/source.tgz --strip-components 1 -C "${GITHUB_WORKSPACE}"

      - name: Install Playwright, Chromium and yt-dlp
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install --user -U "yt-dlp[default]"
          ffmpeg -version | head -n 1

      - name: Official YouTube iframe playback
        id: iframe
        continue-on-error: true
        run: node experiments/youtube-playback/check-iframe.mjs

      - name: Alternative stream decode using FFmpeg
        id: stream
        if: steps.iframe.outcome != 'success'
        continue-on-error: true
        run: python experiments/youtube-playback/check-stream.py

      - name: Verify a method succeeded
        shell: bash
        env:
          IFRAME_OUTCOME: ${{ steps.iframe.outcome }}
          STREAM_OUTCOME: ${{ steps.stream.outcome }}
        run: |
          if [ "$IFRAME_OUTCOME" = "success" ] || [ "$STREAM_OUTCOME" = "success" ]; then
            echo 'PASS: At least one independent YouTube playback method succeeded'
          else
            echo 'FAIL: Neither YouTube playback method succeeded'
            exit 1
          fi

      - name: Print diagnostic reports
        if: always()
        run: |
          for path in experiments/youtube-playback/artifacts/*-report.json; do
            if [ -f "$path" ]; then echo "=== $path ==="; cat "$path"; fi
          done
