name: Production

on:
  workflow_dispatch:
    inputs:
      execution_id: {description: Immutable execution identifier, required: true, type: string}
      source_sha: {description: Exact private execution revision, required: true, type: string}

concurrency:
  group: production-${{ inputs.execution_id }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: exec
    container:
      image: ghcr.io/skyfremen/runtime-base@sha256:6ab68475deb3f0c3e531ff2913da283ceb7e682572acdbd1bff14709b07ffdca
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: runtime
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      RUNTIME_AUTH_A: ${{ secrets.RUNTIME_AUTH_A }}
      RUNTIME_AUTH_B: ${{ secrets.RUNTIME_AUTH_B }}
      RUNTIME_AUTH_C: ${{ secrets.RUNTIME_AUTH_C }}
      RUNTIME_COMMIT_SHA: ${{ github.sha }}
      EXECUTION_ID: ${{ inputs.execution_id }}
    steps:
      - name: Load exact runtime source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}"
          urllib.request.urlretrieve(url,"/tmp/runtime-source.tgz")
          PY
          tar --extract --gzip --file /tmp/runtime-source.tgz --strip-components 1 --directory "${GITHUB_WORKSPACE}"

      - name: Fetch exact immutable execution
        run: >-
          python runtime/transport.py fetch
          --execution-id "${{ inputs.execution_id }}"
          --source-sha "${{ inputs.source_sha }}"
          --output /tmp/runtime-execution.json

      - name: Produce and verify scheduled video
        run: python runtime/core.py --manifest /tmp/runtime-execution.json
