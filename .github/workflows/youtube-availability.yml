name: YouTube Public Video Availability (Not Playback)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-availability.yml"
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Public YouTube video or Shorts URL"
        required: true
        type: string
        default: "https://www.youtube.com/watch?v=aqz-KE-bpKQ"

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      YOUTUBE_URL: ${{ inputs.youtube_url }}
    steps:
      - name: Load isolated test source
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request
          urllib.request.urlretrieve(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/{os.environ['GITHUB_SHA']}",
            "/tmp/source.tgz")
          PY
          tar -xzf /tmp/source.tgz --strip-components 1 -C "${GITHUB_WORKSPACE}"

      - name: Check YouTube metadata availability
        run: python experiments/youtube-playback/check-availability.py
