name: Analytics Diagnostic (One-Off)

on:
  push:
    paths:
      - '.github/workflows/analytics-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: exec
    env:
      PRIVATE_STATE_REPOSITORY: ${{ secrets.PRIVATE_STATE_REPOSITORY }}
      PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
      RUNTIME_AUTH_A: ${{ secrets.RUNTIME_AUTH_A }}
      RUNTIME_AUTH_B: ${{ secrets.RUNTIME_AUTH_B }}
      RUNTIME_AUTH_C: ${{ secrets.RUNTIME_AUTH_C }}
    steps:
      - name: Reconcile public YouTube videos vs analytics snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, shutil, tarfile, tempfile, urllib.parse, urllib.request
          from datetime import datetime, timezone

          def req_json(url, *, data=None, headers=None):
              r=urllib.request.Request(url, data=data, headers=headers or {})
              with urllib.request.urlopen(r, timeout=60) as resp:
                  return json.load(resp)

          # OAuth access token
          body=urllib.parse.urlencode({
              'client_id': os.environ['RUNTIME_AUTH_A'],
              'client_secret': os.environ['RUNTIME_AUTH_B'],
              'refresh_token': os.environ['RUNTIME_AUTH_C'],
              'grant_type': 'refresh_token',
          }).encode()
          tok=req_json('https://oauth2.googleapis.com/token', data=body,
                       headers={'Content-Type':'application/x-www-form-urlencoded'})['access_token']
          auth={'Authorization': f'Bearer {tok}', 'Accept':'application/json'}

          # Enumerate the authenticated channel's uploads, then keep only public videos.
          ch=req_json('https://www.googleapis.com/youtube/v3/channels?'+urllib.parse.urlencode({
              'part':'contentDetails','mine':'true'}), headers=auth)
          uploads=ch['items'][0]['contentDetails']['relatedPlaylists']['uploads']
          upload_ids=[]
          page=None
          while True:
              p={'part':'contentDetails','playlistId':uploads,'maxResults':50}
              if page: p['pageToken']=page
              d=req_json('https://www.googleapis.com/youtube/v3/playlistItems?'+urllib.parse.urlencode(p), headers=auth)
              upload_ids += [x['contentDetails']['videoId'] for x in d.get('items',[])]
              page=d.get('nextPageToken')
              if not page: break

          yt={}
          for i in range(0,len(upload_ids),50):
              ids=upload_ids[i:i+50]
              d=req_json('https://www.googleapis.com/youtube/v3/videos?'+urllib.parse.urlencode({
                  'part':'snippet,status','id':','.join(ids),'maxResults':50}), headers=auth)
              for x in d.get('items',[]):
                  if (x.get('status') or {}).get('privacyStatus')=='public':
                      s=x.get('snippet') or {}
                      yt[x['id']]={'title':s.get('title',''),'publishedAt':s.get('publishedAt','')}

          # Download exact current private source of truth.
          repo=os.environ['PRIVATE_STATE_REPOSITORY']
          gh={'Authorization': f"Bearer {os.environ['PRIVATE_STATE_TOKEN']}",
              'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          ref=req_json(f'https://api.github.com/repos/{repo}/git/ref/heads/main', headers=gh)
          sha=ref['object']['sha']
          td=pathlib.Path(tempfile.mkdtemp(prefix='analytics-diag-'))
          tgz=td/'state.tgz'
          r=urllib.request.Request(f'https://api.github.com/repos/{repo}/tarball/{sha}', headers=gh)
          with urllib.request.urlopen(r, timeout=120) as resp, tgz.open('wb') as out:
              shutil.copyfileobj(resp,out)
          ex=td/'extract'; ex.mkdir()
          with tarfile.open(tgz,'r:gz') as tf: tf.extractall(ex)
          root=next(p for p in ex.iterdir() if p.is_dir())

          # Map all production results by YouTube id.
          result_by_vid={}
          for p in sorted((root/'content'/'results').glob('wd-*.json')):
              try: d=json.loads(p.read_text())
              except Exception: continue
              vid=str(d.get('youtube_video_id',''))
              if vid:
                  result_by_vid[vid]={
                      'path':p.relative_to(root).as_posix(),
                      'content_id':d.get('content_id'),
                      'result_version':d.get('result_version'),
                      'publish_at':d.get('publish_at'),
                      'published_at':d.get('published_at'),
                      'status':d.get('status'),
                      'visibility':d.get('visibility'),
                  }

          # Read latest analytics snapshot.
          snaps=sorted((root/'content'/'analytics'/'snapshots').glob('analytics-*.json'))
          latest=json.loads(snaps[-1].read_text()) if snaps else {'videos':[]}
          snap_ids={str(x.get('youtube_video_id','')) for x in latest.get('videos',[])}

          missing=[]
          for vid,meta in yt.items():
              if vid in snap_ids: continue
              m=result_by_vid.get(vid)
              if not m:
                  reason='NO_RESULT_MAPPING'
              elif m.get('published_at') and not m.get('publish_at'):
                  reason='LEGACY_PUBLISHED_AT_FIELD'
              else:
                  reason='OTHER_MAPPED_EXCLUSION'
              missing.append({'youtube_video_id':vid, **meta, 'reason':reason, 'mapping':m})

          print('=== ANALYTICS RECONCILIATION ===')
          print('private_head=',sha)
          print('latest_snapshot=', snaps[-1].name if snaps else None)
          print('youtube_public_count=',len(yt))
          print('snapshot_video_count=',len(snap_ids))
          print('public_missing_from_snapshot=',len(missing))
          print('--- missing public videos ---')
          for x in sorted(missing,key=lambda z:z.get('publishedAt','')):
              print(json.dumps(x,ensure_ascii=False,sort_keys=True))
          print('--- summary ---')
          counts={}
          for x in missing: counts[x['reason']]=counts.get(x['reason'],0)+1
          print(json.dumps(counts,sort_keys=True))
          PY
